[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# See https://setuptools.pypa.io/en/latest/userguide/quickstart.html for more project configuration options.
name = "gearlaunch"
dynamic = ["version"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    {name = "GEAR", email = "gear@gear.com"}
]
requires-python = ">=3.10"
dependencies = [
    "termcolor",
    "pandas",
    "pyyaml",
    "tqdm",
    "tabulate",
    "pytz",
    "loguru",
]
license = {file = "LICENSE"}

[project.scripts]
oinfo = "gearlaunch.oinfo:oinfo"
odummy = "gearlaunch.odummy:main"
okill = "gearlaunch.okill:main"
orun = "gearlaunch.orun:main"
obarrier = "gearlaunch.obarrier:obarrier"
ols = "gearlaunch.ols:ols"
omonitor = "gearlaunch.omonitor:main"
owhy = "gearlaunch.owhy:main"
ossh = "gearlaunch.ossh:main"
oforward = "gearlaunch.oforward:main"
ray_forward = "gearlaunch.ray_forward:ray_forward"

[project.urls]
# Homepage = "https://github.com/nvglab/GearLaunch"
# Repository = "https://github.com/nvglab/GearLaunch"
# Changelog = "https://github.com/nvglab/GearLaunch/blob/main/CHANGELOG.md"
# Documentation = "https://gearlaunch.readthedocs.io/"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy>=1.0",
    "black>=23.0",
    "isort>=5.12",
    "pytest",
    "pytest-sphinx",
    "pytest-cov",
    "twine>=1.11.0",
    "build",
    "setuptools",
    "wheel",
    "Sphinx>=4.3.0",
    "furo>=2023.7.26",
    "myst-parser>=1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-autodoc-typehints>=1.23.3",
    "packaging",
]

[tool.setuptools.packages.find]
exclude = [
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
    "docs*",
    "scripts*"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
gearlaunch = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "gearlaunch.version.VERSION"}

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3

# You can override these pyright settings by adding a personal pyrightconfig.json file.
[tool.pyright]
reportPrivateImportUsage = false

[tool.ruff]
line-length = 115
target-version = "py39"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

