workflow:
  name: {{ name }}
  resources:
    default:
      gpu: {{ gpu }}
      cpu: {{ cpu }}
      memory: {{ memory }}
      storage: {{ storage }}
      # nodesExcluded:
      # - aks-gpu-24770890-vmss000064

  groups:
  - name: debug
    tasks:
    {% for item in range(nodes) %}
    {% if item == 0 %}
    - name: "master"
    {% else %}
    - name: "worker_{{item}}"
    {% endif %}
      image: {{image}}
      command: [ "bash"]
      exitActions:
        COMPLETE: 0-5000
      {% if item == 0 %}
      lead: true
      {% endif %}
      args: ["/tmp/entry{{item}}.sh"]
      credentials:
        gitlab-pat: /tmp/gitlab
      files:
      - path: /tmp/setup_gitlab_auth.sh
        contents: |-
          GITLAB_PAT=$(cat /tmp/gitlab/gitlab-pat)
          
          # Configure git to use the PAT for authentication
          git config --global credential.helper store
          echo "https://token:${GITLAB_PAT}@gitlab-master.nvidia.com" > ~/.git-credentials
          git config --global credential.helper 'store --file ~/.git-credentials'
      - path: /tmp/entry{{item}}.sh
        contents: |
          # Run training
          # ================================================================
          # Your training code (Note: Please modify the training code according your requirement)
          # ================================================================
          # --- set environment variables ---
          echo "MASTER HOST: {{host:master}}"
          export WORKFLOW_ID={{workflow_id}}
          export WORKFLOW_NAME={{name}}
          export HOME={{homedir}}
          export NNODES={{nodes}}
          export NODE_RANK={{item}}
          export WANDB_API_KEY=$(grep 'password' ~/.netrc | awk '{print $2}')
          export MASTER_PORT={{master_port|default(29501)}}
          export TZ="Asia/Singapore"
          export no_proxy="127.0.0.1,localhost"

          if [ $NODE_RANK -eq 0 ]; then
            export MASTER_ADDR=$(hostname -I | awk '{print $1}')
          else
            # maybe multiple addresses
            export MASTER_ADDR=$(nslookup {{host:master}} | grep -oP 'Address: \K\d[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' | head -n 1)
          fi
          
          # must put exec after grep -oP
          WORKFLOW_DIR="$HOME/.osmo/{{workflow_id}}"
          mkdir -p $WORKFLOW_DIR

          export WANDB_NOTES="$WORKFLOW_ID, nnodes $NNODES"

          # add the following to /etc/workflow_env
          echo "export MASTER_ADDR=$MASTER_ADDR" >> /etc/workflow_env
          echo "export MASTER_PORT=$MASTER_PORT" >> /etc/workflow_env
          echo "export NNODES=$NNODES" >> /etc/workflow_env
          echo "export NODE_RANK=$NODE_RANK" >> /etc/workflow_env
          echo "export WORKFLOW_ID=$WORKFLOW_ID" >> /etc/workflow_env
          echo "export WORKFLOW_NAME=$WORKFLOW_NAME" >> /etc/workflow_env

          # compose hosts.txt
          mkdir -p $WORKFLOW_DIR/hosts
          HOST_IP=""
          while [ -z "$HOST_IP" ]; do
            HOST_IP=$(hostname -I | awk '{print $1}')
            if [ -z "$HOST_IP" ]; then
              echo "hostname -I returned empty result, retrying..."
              sleep 1
            fi
          done
          echo "$HOST_IP" > $WORKFLOW_DIR/hosts/host_${NODE_RANK}.txt
          # wait until all host_*.txt are created


          # --- install packages ---
          apt update

          apt install -y iproute2 tmux bc psmisc
          apt install -y lsof
          export DEBIAN_FRONTEND=noninteractive
          apt install -y tzdata
          ln -fs /usr/share/zoneinfo/America/Los_Angeles /etc/localtime
          apt install -y dnsutils ccache pssh rsync fd-find telnet git-lfs git

          apt install -y openssh-server
          rm -rf /var/lib/apt/lists/*

          set -ex

          # redirect stdout and stderr
          set +ex
          if [ $NODE_RANK -eq 0 ]; then
            FILENAME="master.log"
          else
            FILENAME="worker_${NODE_RANK}.log"
          fi
          exec > >(tee -a >(while IFS= read -r line; do echo "[out] $(date +"%Y-%m-%d %H:%M:%S") $line"; done >> "$WORKFLOW_DIR/$FILENAME"))
          exec 2> >(tee -a >(while IFS= read -r line; do echo "[err] $(date +"%Y-%m-%d %H:%M:%S") $line"; done >> "$WORKFLOW_DIR/$FILENAME"))
          set -ex

          export PATH=$HOME/.local/bin:$HOME/miniconda3/bin:$HOME/osmo/:$PATH:$HOME/homebrew/bin/

          # --- configure ssh ---
          mkdir -p /var/run/sshd
          # Backup sshd_config before modifying
          SSHD_CONFIG="/etc/ssh/sshd_config"

          # Configure SSH to allow passwordless root login
          echo "Configuring SSH for passwordless root login..."
          sed -i '/^#\?PermitRootLogin/s/.*/PermitRootLogin yes/' "$SSHD_CONFIG"
          sed -i '/^#\?PasswordAuthentication/s/.*/PasswordAuthentication yes/' "$SSHD_CONFIG"
          sed -i '/^#\?PermitEmptyPasswords/s/.*/PermitEmptyPasswords yes/' "$SSHD_CONFIG"
          sed -i '/^#\?PubkeyAuthentication/s/.*/PubkeyAuthentication yes/' "$SSHD_CONFIG"
          sed -i '/^#\?PubkeyAcceptedKeyTypes/s/.*/PubkeyAcceptedKeyTypes ssh-ed25519,ssh-ed25519-cert-v01@openssh.com/' "$SSHD_CONFIG"

          # Set empty password for root
          passwd -d root
          tmux new-session -d -s "ssh" "/usr/sbin/sshd -D"

          if [ $NODE_RANK -eq 0 ]; then
            bash /tmp/setup_gitlab_auth.sh
          fi


          HOST_WAIT_TIMEOUT=30  # seconds
          HOST_WAIT_START=$(date +%s)
          while [ $(ls $WORKFLOW_DIR/hosts/host_*.txt | wc -l) -lt $NNODES ]; do
            ls $WORKFLOW_DIR/hosts/
            echo "Waiting for all host_*.txt to be created"
            sleep 1
            HOST_WAIT_ELAPSED=$(( $(date +%s) - HOST_WAIT_START ))
            if [ $HOST_WAIT_ELAPSED -ge $HOST_WAIT_TIMEOUT ]; then
              echo "Timeout waiting for host_*.txt files to be created, continuing anyway" >&2
              break
            fi
          done
          if [ $NODE_RANK -eq 0 ]; then
            touch $WORKFLOW_DIR/hosts_tmp.txt
            touch $WORKFLOW_DIR/hosts_tmp2.txt
            for i in $(seq 0 $((NNODES-1))); do
              # Strip redundant whitespace and newlines
              CUR_IP=$(cat $WORKFLOW_DIR/hosts/host_${i}.txt | tr -d '\n' | tr -d ' ')
              echo "$CUR_IP" >> $WORKFLOW_DIR/hosts_tmp.txt
            done
            mv $WORKFLOW_DIR/hosts_tmp.txt $WORKFLOW_DIR/hosts.txt
          fi
          while [ ! -f $WORKFLOW_DIR/hosts.txt ]; do
            echo "Waiting for hosts.txt to be created"
            sleep 1
          done
          cp -r $WORKFLOW_DIR/hosts.txt /etc/osmo_hosts.txt

          # --- set home directory ---
          export TERM=xterm
          if [ -d "/mnt/aws-lfs-01/" ]; then
            echo "Using aws-lfs-01"
            export HOME=/mnt/aws-lfs-01/shared/{{user}}
            USER_GID=1021
            USER_UID=1021
          elif [ -d "/mnt/amlfs-04/" ]; then
            echo "Using amlfs-04"
            export HOME=/mnt/amlfs-04/home/{{user}}
            USER_GID=1021
            USER_UID=1021
          elif [ -d "/mnt/lfs/" ]; then
            echo "Using lfs"
            export HOME=/mnt/lfs/home/{{user}}
            USER_GID=1021
            USER_UID=1021
          elif [ -d "/mnt/amlfs-03/" ]; then
            echo "Using amlfs-03"
            export HOME=/mnt/amlfs-03/shared/{{user}}
            USER_GID=1021
            USER_UID=1021
          fi
          groupadd -g "$USER_GID" "{{user}}"
          adduser --home "$HOME" --uid "$USER_UID" --gid "$USER_GID" --disabled-password --gecos "" "{{user}}"

          # --- set password ---
          passwd -d {{user}}

          # --- set for gb200 ---
          if [ -d /mnt/aws-lfs-01/  ]; then
            rm -rf /opt/amazon/
            PATH=/usr/bin:/usr/local/bin:$PATH uv pip install --system --break-system-packages "Cython>=3.1.4" "setuptools>=69" "wheel>=0.43" pkgconfig

            # Install py_spy and memray
            PATH=/usr/bin:/usr/local/bin:$PATH uv pip install --system --break-system-packages /mnt/aws-lfs-01/shared/collections/wheel/py_spy-0.4.1-py3-none-manylinux_2_39_aarch64.whl /mnt/aws-lfs-01/shared/collections/wheel/memray-1.19.0-cp312-cp312-linux_aarch64.whl

            # Install torchcodec
            PATH=/usr/bin:/usr/local/bin:$PATH uv pip install --system --break-system-packages /mnt/aws-lfs-01/shared/collections/wheel/torchcodec-0.4.0-cp312-cp312-linux_aarch64.whl
          fi

          # --- set workdir ---
          if [ -d "{{workdir}}" ]; then
            cd {{workdir}}
          else
            echo "{{workdir}} does not exist"
          fi

          # --- update ca certificate ---
          apt install -y ca-certificates
          update-ca-certificates
          cat /etc/ssl/certs/ca-certificates.crt > /etc/ssl/certs/npm-bundle.crt

          # --- unset proxy ---
          export HTTP_PROXY=
          export HTTPS_PROXY=
          export http_proxy=
          export https_proxy=
          export ALL_PROXY=
          export all_proxy=

          # --- set healthy gpu ids ---
          if [ -n "$(which gpu-fryer 2>/dev/null)" ]; then
            # temporarily more aggressive, kill all unhealthy nodes
            gpu-fryer 60
            # ngpus=$(nvidia-smi --query-gpu=gpu_name,memory.total,memory.free --format=csv,noheader | wc -l)
            # gpu-fryer 30 > /tmp/gpu_fryer.log || true
            # grep -o 'GPU [0-7]' /tmp/gpu_fryer.log | awk '{print $2}' | sort -n | uniq > /tmp/bad.txt
            # seq 0 $((ngpus-1)) > /tmp/all.txt
            # grep -vxFf /tmp/bad.txt /tmp/all.txt | paste -sd, - > /etc/healthy_gpu_ids.txt
          fi

          {{ cmd }}
    {% endfor %}
