
workflow:
  name: {{ name }}
  timeout:
    exec_timeout: {{ exec_timeout }}
    queue_timeout: 24h
  resources:
    default:
      gpu: {{ gpu }}
      cpu: {{ cpu }}
      memory: {{ memory }}
      storage: {{ storage }}

  groups:
  - name: debug
    tasks:
    {% for item in range(nodes) %}
    {% if item == 0 %}
    - name: "master"
    {% else %}
    - name: "worker_{{item}}"
    {% endif %}
      image: {{image}}
      command: [ "bash"]
      {% if item == 0 %}
      lead: true
      args: ["/tmp/entry.sh"]
      files:
      - path: /tmp/entry.sh
        contents: |
          # Run training
          # ================================================================
          # Your training code (Note: Please modify the training code according your requirement)
          # ================================================================
          set -ex
          export HOME={{homedir}}
          export NNODES={{nodes}}
          export NODE_RANK={{item}}
          export WANDB_API_KEY=$(grep 'password' ~/.netrc | awk '{print $2}')
          export MASTER_PORT={{master_port|default(29501)}}
          export TZ="Asia/Singapore"
          source $HOME/.bashrc

          export MASTER_ADDR=$(hostname -I | awk '{print $1}')
          export WORKFLOW_ID={{workflow_id}}
          export WORKFLOW_NAME={{name}}
          export PATH=$HOME/.local/bin:$HOME/miniconda3/bin:$HOME/osmo/:$PATH

          # redirect stdout and stderr
          set +ex
          log_dir="$HOME/osmo_logs/{{workflow_id}}"
          mkdir -p $log_dir
          exec > >(tee -a >(while IFS= read -r line; do echo "[out] $(date +"%Y-%m-%d %H:%M:%S") $line"; done >> "$log_dir/master.log"))
          exec 2> >(tee -a >(while IFS= read -r line; do echo "[err] $(date +"%Y-%m-%d %H:%M:%S") $line"; done >> "$log_dir/master.log"))
          set -ex

          export WANDB_NOTES="$WORKFLOW_ID, nnodes $NNODES"

          echo "export MASTER_ADDR=$MASTER_ADDR" >> /etc/workflow_env
          echo "export MASTER_PORT=$MASTER_PORT" >> /etc/workflow_env
          echo "export NNODES=$NNODES" >> /etc/workflow_env
          echo "export NODE_RANK=$NODE_RANK" >> /etc/workflow_env
          echo "export WORKFLOW_ID=$WORKFLOW_ID" >> /etc/workflow_env
          echo "export WORKFLOW_NAME=$WORKFLOW_NAME" >> /etc/workflow_env
          
          set +ex
          /mnt/amlfs-01/resume.sh {{user}}
          set -ex

          export TERM=xterm
          export HOME=/mnt/amlfs-03/shared/{{user}}
          obarrier --num_nodes $NNODES --connect $MASTER_ADDR --rank $NODE_RANK --port $MASTER_PORT --timeout 600

          cd {{workdir}}

          # ============= Maybe UploadPDX ================
          if [ "{{upload_pdx}}" == "True" ]; then
          su - {{user}} <<EOF
            source /etc/workflow_env
            export PATH=$PATH
            echo "Waiting for staging to complete"

            while true; do
              STAGED_PATH="/mnt/amlfs-02/shared/osmo_staging/{{workflow_id}}/"
              echo "Checking if \$STAGED_PATH exists"

              # continue if the path exists and $STAGED_PATH/.staged exists
              if [ -d "\$STAGED_PATH" ] && [ -f "\$STAGED_PATH/.staged" ]; then
                echo "Staging completed"
                mkdir -p /tmp/staged/
                # isolate .* files and don't upload them
                cp -r \$STAGED_PATH/* /tmp/staged/
                osmo dataset upload gear/repo-{{workflow_id}} /tmp/staged/
                echo "Uploaded to PDX"
                break
              fi

              sleep 5
            done
            echo "Staged repo uploaded to PDX"

          EOF

          mkdir -p /workspace/legion
          STAGED_PATH="/mnt/amlfs-02/shared/osmo_staging/{{workflow_id}}/"
          cp -r $STAGED_PATH/* /workspace/legion/
          cp -r $STAGED_PATH/.[!.]* /workspace/legion/

          echo "Copied from staging"
          
          ## Soft link checkpoint* and .venv
          find {{workdir}} -maxdepth 1 -type d -path "*/checkpoint*" | xargs -I {} ln -s {} /workspace/legion/
          if [ -d "{{workdir}}/.venv" ]; then
            ln -s {{workdir}}/.venv /workspace/legion/
          fi

          if [ -d "{{workdir}}/outputs" ]; then
            ln -s {{workdir}}/outputs /workspace/legion/
          fi

          if [ -d "{{workdir}}/data" ]; then
            ln -s {{workdir}}/data /workspace/legion/
          fi

          cd /workspace/legion/
          fi
          # ============================================

          {{ cmd }}


      {% else %}
      args: ["/tmp/entry{{item}}.sh"]
      files:
      - path: /tmp/entry{{item}}.sh
        contents: |
          # Run training
          # ================================================================
          # Your training code (Note: Please modify the training code according your requirement)
          # ================================================================
          set -ex
          export HOME={{homedir}}
          export NNODES={{nodes}}
          export NODE_RANK={{item}}
          export WANDB_API_KEY=$(grep 'password' ~/.netrc | awk '{print $2}')
          export MASTER_PORT={{master_port|default(29501)}}
          export TZ="Asia/Singapore"
          source $HOME/.bashrc

          export MASTER_ADDR=$(nslookup {{host:master}} | grep -oP \
            'Address: \K\d[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}')
          export WORKFLOW_ID={{workflow_id}}
          export WORKFLOW_NAME={{name}}
          export PATH=$HOME/.local/bin:$HOME/miniconda3/bin:$HOME/osmo/:$PATH

          # redirect stdout and stderr
          set +ex
          log_dir="$HOME/osmo_logs/{{workflow_id}}"
          mkdir -p $log_dir
          exec > >(tee -a >(while IFS= read -r line; do echo "[out] $(date +"%Y-%m-%d %H:%M:%S") $line"; done >> "$log_dir/worker_{{item}}.log"))
          exec 2> >(tee -a >(while IFS= read -r line; do echo "[err] $(date +"%Y-%m-%d %H:%M:%S") $line"; done >> "$log_dir/worker_{{item}}.log"))
          set -ex

          export WANDB_NOTES="$WORKFLOW_ID, nnodes $NNODES"

          echo "export MASTER_ADDR=$MASTER_ADDR" >> /etc/workflow_env
          echo "export MASTER_PORT=$MASTER_PORT" >> /etc/workflow_env
          echo "export NNODES=$NNODES" >> /etc/workflow_env
          echo "export NODE_RANK=$NODE_RANK" >> /etc/workflow_env
          echo "export WORKFLOW_ID=$WORKFLOW_ID" >> /etc/workflow_env
          echo "export WORKFLOW_NAME=$WORKFLOW_NAME" >> /etc/workflow_env

          # ============================================
          set +ex
          /mnt/amlfs-01/resume.sh {{user}}
          set -ex
          export TERM=xterm
          export HOME=/mnt/amlfs-03/shared/{{user}}
          obarrier --num_nodes $NNODES --connect $MASTER_ADDR --rank $NODE_RANK --port $MASTER_PORT --timeout 600

          cd {{workdir}}

          # ============= Maybe UploadPDX ================
          if [ "{{upload_pdx}}" == "True" ]; then

          while true; do
            STAGED_PATH="/mnt/amlfs-02/shared/osmo_staging/{{workflow_id}}/"
            echo "Checking if $STAGED_PATH exists"

            # continue if the path exists and $STAGED_PATH/.staged exists
            if [ -d "$STAGED_PATH" ] && [ -f "$STAGED_PATH/.staged" ]; then
              echo "Staging completed"
              mkdir -p /workspace/legion
              cp -r $STAGED_PATH/* /workspace/legion
              cp -r $STAGED_PATH/.[!.]* /workspace/legion
              echo "Copied from staging"
              break
            fi

            sleep 5
          done

          ## Soft link checkpoint* and .venv
          find {{workdir}} -maxdepth 1 -type d -path "*/checkpoint*" | xargs -I {} ln -s {} /workspace/legion/
          if [ -d "{{workdir}}/.venv" ]; then
            ln -s {{workdir}}/.venv /workspace/legion/
          fi

          if [ -d "{{workdir}}/outputs" ]; then
            ln -s {{workdir}}/outputs /workspace/legion/
          fi

          if [ -d "{{workdir}}/data" ]; then
            ln -s {{workdir}}/data /workspace/legion/
          fi

          cd /workspace/legion/
          fi
          # ============================================

          {{ cmd }}
    {% endif %}
    {% endfor %}